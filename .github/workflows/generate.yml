name: Generate Snake
permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # jalan setiap hari jam 00.00 UTC

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Generate SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ahm3djunaedi
          outputs: |
            dist/github-snake.svg

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Update snake animation
          branch: main
          file_pattern: dist/github-snake.svg
